amr_sweeper_attitude_controller_node:
  ros__parameters:
    attitude_estimation_enabled: true
    safety_stop_enabled: true

    base_footprint_frame: base_footprint
    base_link_frame: base_link
    tool_link_frame: tool_link
    base_roll_joint_name: base_roll_joint
    base_pitch_joint_name: base_pitch_joint
    stop_topic_name: safety_msgs/stop

    publish_base_link_joint_states: true
    publish_tool_link_tf: false

    imu_topics:
      - imu/data_raw
    imu_weights:
      - 1.0

    imu_timeout_sec: 0.25
    publish_rate_hz: 10.0

    filter:
      type: complementary
      accel_alpha: 0.02
      gyro_alpha: 0.98
      max_accel_norm_error: 2.0

    stop:
      roll_warning_deg: 8.0
      pitch_warning_deg: 8.0
      roll_stop_deg: 15.0
      pitch_stop_deg: 15.0
      roll_latch_deg: 25.0
      pitch_latch_deg: 25.0
      nominal_roll_deg: 0.0
      nominal_pitch_deg: 5.0
      hard_decel_threshold_mps2: 4.0
      shock_threshold_mps2: 12.0
      min_event_duration_ms: 80
      require_manual_reset: true
