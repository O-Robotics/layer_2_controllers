/**:
  ros__parameters:
    # -- Base Link Attitude ----------------------------------------------------
    attitude_estimation_enabled:                       true                     # Enable roll/pitch estimation for the chassis attitude transform.
    attitude_estimation.publish_rate_hz:               50.0                     # Base-link attitude estimation and TF publish rate in Hz.
    attitude_estimation.parent_frame:                  base_footprint           # Parent frame for the dynamic chassis attitude transform.
    attitude_estimation.child_frame:                   base_link                # Child frame for the dynamic chassis attitude transform.
    attitude_estimation.publish_tf:                    true                     # Publish the dynamic base_footprint->base_link TF directly.
    attitude_estimation.hold_last_transform:           true                     # Keep publishing the last valid base-link transform when IMU data becomes unhealthy.
    attitude_estimation.initial_roll_deg:              0.0                      # Startup seed for base_link roll until a healthy estimate is available.
    attitude_estimation.initial_pitch_deg:             4.5                      # Startup seed for base_link pitch until a healthy estimate is available.
    attitude_estimation.origin_z_m:                    0.13                     # Fixed vertical offset from base_footprint to base_link.
    attitude_estimation.imu_topic:                     imu/data_raw             # IMU topic used for the base-link attitude estimate.
    attitude_estimation.imu_weights:                   1.0                      # Relative weight of the configured base-link IMU input.
    attitude_estimation.imu_timeout_warning_sec:       0.3                      # Raise a warning if the base-link IMU stops updating within this time.
    attitude_estimation.imu_timeout_error_sec:         1.0                      # Raise an error if the base-link IMU stops updating within this time.
    attitude_estimation.imu_startup_grace_sec:         6.0                      # Allow the IMU driver startup sequence to finish before timeout faults can latch.
    attitude_estimation.imu_timeout_stop_enabled:      true                     # Publish a safety stop if the base-link IMU timeout reaches the error threshold.

    # -- Tool Link Angle ---------(still not fully implemented)-----------------
    tool_angle_estimation_enabled:                     false                    # Reserved future feature for tool_link attitude estimation.
    tool_angle_estimation.publish_rate_hz:             50.0                     # Reserved tool-link update rate; currently unused.
    tool_angle_estimation.parent_frame:                base_link                # Reserved parent frame for a future tool-link transform.
    tool_angle_estimation.child_frame:                 tool_link                # Reserved child frame for a future tool-link transform.
    tool_angle_estimation.publish_tf:                  false                    # Keep disabled until tool-link attitude estimation is implemented.
    tool_angle_estimation.hold_last_transform:         true                     # Reserved behavior for holding the last valid tool-link transform.
    tool_angle_estimation.initial_roll_deg:            0.0                      # Reserved startup seed for tool_link roll.
    tool_angle_estimation.initial_pitch_deg:           0.0                      # Reserved startup seed for tool_link pitch.
    tool_angle_estimation.origin_z_m:                  0.0                      # Reserved vertical offset for a future tool-link transform.
    tool_angle_estimation.imu_topic:                   ""                       # Reserved IMU topic for tool-link attitude estimation.
    tool_angle_estimation.imu_weights:                 1.0                      # Reserved IMU weight for tool-link attitude estimation.
    tool_angle_estimation.imu_timeout_warning_sec:     0.3                      # Reserved timeout warning for tool-link attitude estimation.
    tool_angle_estimation.imu_timeout_error_sec:       1.0                      # Reserved timeout error for tool-link attitude estimation.
    tool_angle_estimation.imu_startup_grace_sec:       6.0                      # Reserved startup grace period for tool-link attitude estimation.
    tool_angle_estimation.imu_timeout_stop_enabled:    false                    # Reserved timeout-stop behavior for tool-link attitude estimation.

    # -- Safety Stop -----------------------------------------------------------
    safety_stop_enabled:                               true                     # Allow the controller to publish stop events when thresholds are exceeded.
    stop_topic_name:                                   safety_msgs/stop         # Shared safety-stop topic consumed by the layer 2 safety controller.
    stop.nominal_roll_deg:                             0.0                      # Expected nominal roll angle for the robot on level ground.
    stop.nominal_pitch_deg:                            5.0                      # Expected nominal pitch angle for the robot on level ground.
    stop.roll_warning_deg:                             15.0                     # Raise a warning when roll exceeds this magnitude from nominal.
    stop.pitch_warning_deg:                            15.0                     # Raise a warning when pitch exceeds this magnitude from nominal.
    stop.roll_stop_deg:                                30.0                     # Publish a stop when roll exceeds this magnitude from nominal.
    stop.pitch_stop_deg:                               30.0                     # Publish a stop when pitch exceeds this magnitude from nominal.
    stop.require_manual_reset:                         true                     # Keep the stop latched until a manual reset is requested.
