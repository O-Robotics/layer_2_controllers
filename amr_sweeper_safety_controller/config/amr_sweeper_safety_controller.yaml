/**:
  ros__parameters:
    enabled:                           true                # Master enable for the Layer 2 safety controller.
    publish_rate_hz:                   20.0                # While latched, zero wheel and tool commands are republished at this rate.

    # -- Common stop input ----------------------------------------------------
    stop_topic_name:                   safety_msgs/stop    # Shared amr_sweeper_safety_msgs/SafetyStop topic any package can publish to.

    # -- Stop-command outputs -------------------------------------------------
    wheel_stop_topic:                  cmd_vel_safety_stop # Highest-priority wheel stop command consumed by the sweeping controller.
    tool_stop_topic:                   cmd_vel_joy_tools   # Zero tool command republished while latched to stop the tool path too.
    publish_zero_tool_command:         true                # Keep the tool controller forced to zero while the stop is latched.
    publish_direct_hardware_stop:      true                # Also publish zero commands at the final wheel and tool controller inputs.
    wheel_hardware_stop_topic:         drive_controller/cmd_vel # Final stamped wheel-command topic consumed by the drive controller path.
    tool_hardware_stop_topic:          tool_controller/commands # Final tool-controller command topic for the tool motors.

    # -- Mission and hardware stop integrations -------------------------------
    mission_stop_enabled:                true              # Call layer 0 end_mission when a new safety stop latches.
    end_mission_service:                 end_mission       # Mission-executor service used to abort the active mission and request IDLING.
    direct_can_motor_stop_enabled:       true              # Send direct CAN stop/e-stop frames to the motor drives while the stop is latched.
    odrive_direct_can_stop_enabled:      true              # Send ODrive CANSimple e-stop frames to the wheel drives.
    odrive_can_interface:                can0              # SocketCAN interface used to reach the ODrive wheel nodes.
    odrive_node_ids:                                        # ODrive CANSimple node IDs for the wheel motors.
      - 0
      - 2
    steadydrive_direct_can_stop_enabled: true              # Send direct stop/off frames to the Steadydrive tool motors.
    steadydrive_can_interface:           can0              # SocketCAN interface used to reach the Steadydrive tool motors.
    steadydrive_motor_can_ids:                             # CAN IDs for the Steadydrive tool motors.
      - "0x141"
      - "0x142"
    button_can_monitor_enabled:          true              # Listen for CAN frames from the physical stop-button module and latch a safety stop on press.
    button_can_interface:                can0              # SocketCAN interface used to receive button-module frames.
    button_can_base_id:                  0x200             # Button module base CAN ID; firmware emits events on base_id and status on base_id + 1.
    clear_safety_stop_services:                            # Hardware recovery services called before the latch is cleared.
      - /odrive_ros2_control/clear_safety_stop            # Clears ODrive protection latches and its drive-level e-stop/errors.
      - /steadydrive_ros2_control/clear_safety_stop       # Clears Steadydrive protection latches and re-enables tool motors.
    web_status_topic:                   safety_controller/web_status # Machine-readable safety summary for the operator web UI.
