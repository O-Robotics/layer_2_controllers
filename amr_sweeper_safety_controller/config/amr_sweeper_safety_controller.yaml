/**:
  ros__parameters:
    enabled:                           true                # Master enable for the Layer 2 safety controller.
    publish_rate_hz:                   20.0                # While latched, zero wheel and tool commands are republished at this rate.

    # -- Common stop input ----------------------------------------------------
    stop_topic_name:                   safety_msgs/stop    # Shared amr_sweeper_safety_msgs/SafetyStop topic any package can publish to.

    # -- Stop-command outputs -------------------------------------------------
    wheel_stop_topic:                  safety_controller/cmd_vel_safety_stop # Highest-priority wheel stop command consumed by the sweeping controller.
                                                              # The sweeping controller uses this same stop topic at highest priority for both wheels and tools.

    # -- Mission and hardware stop integrations -------------------------------
    mission_stop_enabled:                true              # Call layer 0 end_mission when a new safety stop latches.
    end_mission_service:                 end_mission       # Mission-executor service used to abort the active mission without leaving the FSM FAULT requested below.
    direct_can_motor_stop_enabled:       true              # Send direct CAN stop/e-stop frames to the motor drives while the stop is latched.
    odrive_direct_can_stop_enabled:      true              # Send ODrive CANSimple e-stop frames to the wheel drives.
    odrive_can_interface:                can0              # SocketCAN interface used to reach the ODrive wheel nodes.
    odrive_node_ids:                                        # ODrive CANSimple node IDs for the wheel motors.
      - 0
      - 2
    steadydrive_direct_can_stop_enabled: true              # Send direct stop/off frames to the Steadydrive tool motors.
    steadydrive_can_interface:           can0              # SocketCAN interface used to reach the Steadydrive tool motors.
    steadydrive_motor_can_ids:                             # CAN IDs for the Steadydrive tool motors.
      - "0x141"
      - "0x142"
    external_can_stop_monitor_enabled:   true              # Latch a safety stop if any other CAN node (e.g. the button module) sends an ODrive e-stop or Steadydrive stop/off command straight to the motors, bypassing this controller.
    button_can_monitor_enabled:          true              # Listen for CAN frames from the physical stop-button module and latch a safety stop on press.
    button_can_interface:                can0              # SocketCAN interface used to receive button-module frames.
    button_can_base_id:                  0x200             # Tunable button module base CAN ID; firmware emits events on base_id and status on base_id + 1.
    button_status_period_ms:             5000              # Expected button status-frame period; matches the current firmware default CFG_STATUS_MS.
    button_heartbeat_timeout_ms:         12000             # Tunable missing-heartbeat timeout in milliseconds before a safety stop is latched.
    fsm_request_service:                 request_state     # Layer 0 supervisor service used to force the robot FSM into FAULT.
    fsm_fault_profile_id:                400               # FAULT profile requested when a safety stop latches.
    fsm_fault_request_priority:          255               # Kept for compatibility/documentation; the FAULT request is sent with force=true so priority is bypassed.
    stop_feedback_timeout_ms:            1500             # Wait this long for direct motor-stop confirmation before reporting a timeout.
    stop_feedback_stale_ms:              500              # Treat motor feedback older than this as stale during stop verification.
    odrive_stop_velocity_threshold_rev_s: 0.05            # Consider an ODrive wheel motor stopped when |vel_estimate| falls below this raw rev/s threshold.
    steadydrive_stop_velocity_threshold_deg_s: 5.0        # Consider a Steadydrive tool motor stopped when |speed| from 0x9C falls below this raw deg/s threshold.
    internal_watchdog_enabled:           true             # Separate thread that forces a stop event if the node stops making progress.
    internal_watchdog_timeout_ms:        1500             # Progress-stall timeout for the internal watchdog.
    internal_watchdog_check_period_ms:   200              # Poll period used by the internal watchdog thread.
    clear_safety_stop_services:                            # Hardware recovery services called before the latch is cleared.
      - /odrive_ros2_control/clear_safety_stop            # Clears ODrive protection latches and its drive-level e-stop/errors.
      - /steadydrive_ros2_control/clear_safety_stop       # Clears Steadydrive protection latches and re-enables tool motors.
    web_status_topic:                   safety_controller/web_status # Machine-readable safety summary for the operator web UI.
