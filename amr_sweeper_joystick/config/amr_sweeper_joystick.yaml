/**/joy_node:
  ros__parameters:
    use_joy_node:     false # Start the physical joystick device node only when a profile explicitly opts in.
    deadzone:         0.05  # Ignore small joystick deflections near center.
    autorepeat_rate:  20.0  # Republish the last joystick command at 20 Hz while held.

/**/teleop_twist_joy_wheels:
  ros__parameters:
    # -- Wheel linear mapping -------------------------------------------------
    axis_linear:                  # Left thumb stick vertical.
      x: 1
    scale_linear:
      x: 0.3                      # Conservative drive speed for the 50:1 gearbox setup.
    scale_linear_turbo:
      x: 0.6                      # Higher drive speed while turbo is held.

    # -- Wheel angular mapping ------------------------------------------------
    axis_angular:                 # Left thumb stick horizontal.
      yaw: 0
    scale_angular:
      yaw: 1.3                    # Nominal turn rate for the 50:1 gearbox setup.
    scale_angular_turbo:
      yaw: 2.6                    # Higher turn rate while turbo is held.

    # -- Enable buttons -------------------------------------------------------
    require_enable_button: true
    enable_button:         4      # Left shoulder button.
    enable_turbo_button:   5      # Right shoulder button.

/**/teleop_twist_joy_tools:
  ros__parameters:
    # -- Tool linear mapping --------------------------------------------------
    axis_linear:                  # Right thumb stick vertical.
      x: 3
    scale_linear:
      x: 0.10
    scale_linear_turbo:
      x: 0.20

    # -- Tool angular mapping -------------------------------------------------
    axis_angular:                 # Right thumb stick horizontal.
      yaw: 2
    scale_angular:
      yaw: 0.10
    scale_angular_turbo:
      yaw: 0.20

    # -- Enable buttons -------------------------------------------------------
    require_enable_button: true
    enable_button:         4      # Left shoulder button.
    enable_turbo_button:   5      # Right shoulder button.
