/**/joy_node:
  ros__parameters:
    deadzone: 0.05
    autorepeat_rate: 20.0

/**/teleop_twist_joy_wheels:
  ros__parameters:
    axis_linear: # left thumb stick vertical
      x: 1
    scale_linear:
      x: 0.3 # for 50 gear ratio, 0.5 for 25 gear ratio
    scale_linear_turbo:
      x: 0.6 # for 50 gear ratio, 1.0 for 25 gear ratio

    axis_angular: # left thumb stick horizontal
      yaw: 0
    scale_angular:
      yaw: 1.3 # for 50 gear ratio, 2.6 for 25 gear ratio
    scale_angular_turbo:
      yaw: 2.6 # for 50 gear ratio, 5.2 for 25 gear ratio
    
    require_enable_button: true
    enable_button: 4  # Left shoulder button
    enable_turbo_button: 5  # Right shoulder button

/**/teleop_twist_joy_tools:
  ros__parameters:
    
    axis_linear:  # right thumb stick vertical
      x: 3
    scale_linear:
      x: 0.10
    scale_linear_turbo:
      x: 0.20

    axis_angular:  # right thumb stick horizontal
      yaw: 2
    scale_angular:
      yaw: 0.10
    scale_angular_turbo:
      yaw: 0.20

    require_enable_button: true
    enable_button: 4  # Left shoulder button
    enable_turbo_button: 5  # Right shoulder button
